nemo = [
    "nemo_toolkit[asr]",
    "cuda-python>=12.4",
    "IPython",
    "datasets>=3.0.0",
    "evaluate",
    "jiwer",
    "num2words",
    "soundfile",
    "librosa",
    "kaldialign",
]

ctranslate2 = [
    "ctranslate2",
    "faster-whisper>=0.8.0",
    "datasets>=3.0.0",
    "evaluate",
    "jiwer",
    "librosa",
    "num2words",
    "kaldialign",
    "transformers",
    "regex",
]
