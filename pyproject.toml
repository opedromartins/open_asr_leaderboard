[project]
name = "open-asr-leaderboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    "torchcodec",
    "tqdm",
    "huggingface-hub[hf-transfer]"
]

[project.scripts]
open-asr-leaderboard = "open_asr_leaderboard:main"

